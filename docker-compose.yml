# Local development database. Start with `docker compose up -d` (or `npm run setup`).
# A fixed project name: every worktree and clone shares one database on port 5432.
name: devmentor

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: devmentor
      POSTGRES_DB: devmentor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmentor -d devmentor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
